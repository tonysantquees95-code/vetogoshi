name: App (Android)

# Confere os scripts e gera o APK do Android (Capacitor). Cada versão boa vira uma release "1.N" com Vetogoshi.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  android:
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Preparar o projeto Android
        working-directory: app
        env:
          VITE_BUILD: ${{ github.run_number }}
        run: |
          npm run build
          npx cap add android
          # a versão do app passa a ser a do build (1.<número>)
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionName\|versionCode" android/app/build.gradle
          python3 - <<'PY'
          import re
          m = "android/app/src/main/AndroidManifest.xml"
          t = open(m, encoding="utf-8").read()
          # o jogo é só em pé; avisos agendados precisam da permissão de notificação (Android 13+)
          t = t.replace("<activity", '<activity android:screenOrientation="portrait"', 1)
          if "REQUEST_INSTALL_PACKAGES" not in t:
              t = t.replace("<application", '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          if "POST_NOTIFICATIONS" not in t:
              t = t.replace("<application", '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application', 1)
          open(m, "w", encoding="utf-8").write(t)
          # o jogo fica ENTRE a barra de notificações e a de navegação (fixas ou não)
          act = "android/app/src/main/java/tech/vetorial/vetogoshi/MainActivity.java"
          import shutil
          shutil.copy("../nativo/src/AtualizadorPlugin.java", "android/app/src/main/java/tech/vetorial/vetogoshi/AtualizadorPlugin.java")
          open(act, "w", encoding="utf-8").write("""package tech.vetorial.vetogoshi;

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AtualizadorPlugin.class);
                  super.onCreate(savedInstanceState);
                  final View conteudo = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(conteudo, (v, insets) -> {
                      Insets b = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                      v.setPadding(b.left, b.top, b.right, b.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  ViewCompat.requestApplyInsets(conteudo);
              }
          }
          """)
          PY
          grep -n "screenOrientation\|POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#05070D' --iconBackgroundColorDark '#05070D' --splashBackgroundColor '#05070D' --splashBackgroundColorDark '#05070D'
          npx cap sync android
      - name: Compilar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # A chave de assinatura fica guardada (cifrada) no servidor da Vênus: cada versão instala por cima da anterior.
      - name: Assinar o APK
        run: bash .github/assinar-apk.sh app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vetogoshi-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publicar:
    needs: [android]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vetogoshi-android
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pacote/app-debug.apk pacote/Vetogoshi.apk
          gh release create "1.${{ github.run_number }}" pacote/Vetogoshi.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vetogoshi 1.${{ github.run_number }}" --notes "Vetogoshi.apk (Android)."
